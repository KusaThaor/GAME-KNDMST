<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Asset Workshop — Hành Trình Thanh Xuân</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="workshop-app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <span class="brand-title">HÀNH TRÌNH THANH XUÂN</span>
        <span class="brand-tag">3D Asset Workshop</span>
      </div>

      <div class="header-info">
        <span class="asset-badge">Module: <strong>Bộ bàn ghế học sinh THCS</strong></span>
      </div>
    </header>

    <!-- Main Layout -->
    <main class="main-layout">
      <!-- 3D Viewport Area -->
      <section class="viewport-area">
        <!-- Floating Toolbar -->
        <div class="viewport-toolbar" id="toolbar"></div>

        <!-- Canvas Container -->
        <div id="viewport"></div>

        <!-- Floating Stats Panel (Inspector) -->
        <div class="stats-panel-wrap" id="stats-panel"></div>
      </section>

      <!-- Control Sidebar -->
      <aside class="sidebar-area">
        <div class="sidebar-header">
          <h2 class="sidebar-title">Bảng điều khiển tham số</h2>
          <p class="sidebar-desc">Tạo sinh mô hình thủ tục theo thời gian thực</p>
        </div>
        <div class="sidebar-content" id="sidebar-content"></div>
      </aside>
    </main>

    <!-- Toast Notification -->
    <div class="toast-notice" id="toast"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
